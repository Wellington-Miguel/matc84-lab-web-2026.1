[project]
name = "matc84-lab-web-2026-1"
version = "0.1.0"
description = "High-availability beverage distributor system (modular monolith)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.137.1",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[[tool.uv.index]]
url = "https://pypi.org/simple/"
default = true
