version: '3.8'

services:
  dynamodb-local:
    image: amazon/dynamodb-local:2.5.3
    container_name: sales-dynamodb-local
    ports:
      - "8123:8000"
    volumes:
      - ./docker/dynamodb:/home/dynamodblocal/data
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data"