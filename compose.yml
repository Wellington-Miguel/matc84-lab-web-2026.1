services:
  postgres:
    image: postgres:16-alpine
    container_name: matc84-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: matc84
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d matc84"]
      interval: 10s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:3
    container_name: matc84-localstack
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      DEBUG: "0"
      SERVICES: sqs
      PERSISTENCE: "1"
    ports:
      - "4566:4566"
    volumes:
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health | grep -q 'sqs'"]
      interval: 10s
      timeout: 5s
      retries: 12

  cognito:
    image: jagregory/cognito-local:latest
    container_name: matc84-cognito
    restart: unless-stopped
    ports:
      - "9229:9229"
    volumes:
      - cognito-data:/app/.cognito

  dynamodb:
    image: amazon/dynamodb-local:latest
    container_name: matc84-dynamodb
    restart: unless-stopped
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    working_dir: /home/dynamodblocal
    ports:
      - "8000:8000"

volumes:
  postgres-data:
  localstack-data:
  cognito-data:
