# docker-compose.yml
# Ambiente local de desenvolvimento — simula AWS localmente
# Uso: docker compose up -d


services:

  # ── PostgreSQL (simula Aurora) ─────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: bebidas-postgres
    environment:
      POSTGRES_DB:       bebidas
      POSTGRES_USER:     bebidasadmin
      POSTGRES_PASSWORD: senha_local_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bebidasadmin -d bebidas"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (simula ElastiCache) ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: bebidas-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 3

  # ── LocalStack (simula SQS da AWS localmente) ──────────────────────────────
  localstack:
    image: localstack/localstack:1.4.0
    container_name: bebidas-localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: sqs
      DEBUG: "0"
      DEFAULT_REGION: us-east-1
    volumes:
      - "./infra/localstack:/etc/localstack/init/ready.d"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Order Service ──────────────────────────────────────────────────────────
  order-service:
    build:
      context: .
      dockerfile: services/order/Dockerfile
    container_name: bebidas-order
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://bebidasadmin:senha_local_dev@postgres:5432/bebidas
      REDIS_URL: redis://redis:6379
      SQS_ORDER_QUEUE_URL: http://localstack:4566/000000000000/bebidas-orders.fifo
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_URL: http://localstack:4566
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Inventory Service ──────────────────────────────────────────────────────
  inventory-service:
    build:
      context: .
      dockerfile: services/inventory/Dockerfile
    container_name: bebidas-inventory
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql://bebidasadmin:senha_local_dev@postgres:5432/bebidas
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Notification Service ─────────────────────────────────────────────────────
  notification-service:
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    container_name: bebidas-notification
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: postgresql://bebidasadmin:senha_local_dev@postgres:5432/bebidas
      SQS_NOTIFICATION_QUEUE_URL: http://localstack:4566/000000000000/notifications.fifo
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    restart: unless-stopped

  # ── Catalog Service ────────────────────────────────────────────────────────
  catalog-service:
    build:
      context: .
      dockerfile: services/catalog/Dockerfile
    container_name: bebidas-catalog
    ports:
      - "8003:8003"
    environment:
      DATABASE_URL: postgresql://bebidasadmin:senha_local_dev@postgres:5432/bebidas
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Payment Service ────────────────────────────────────────────────────────
  payment-service:
    build:
      context: .
      dockerfile: services/payment/Dockerfile
    container_name: bebidas-payment
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://bebidasadmin:senha_local_dev@postgres:5432/bebidas
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
